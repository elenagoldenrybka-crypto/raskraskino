# Автоматическая публикация на GitHub Pages при каждом изменении в ветке main
name: Публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      # Сайт работает на своём домене pro-raskraski.ru (без подпапки).
      # Если когда-нибудь вернётесь на адрес *.github.io/<репозиторий>/, добавьте:
      #   env:
      #     BASE_PATH: /${{ github.event.repository.name }}
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # Публикация отдельным шагом: так GitHub успевает «увидеть» загруженный архив сайта
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
